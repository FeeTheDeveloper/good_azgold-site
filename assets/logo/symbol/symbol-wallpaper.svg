<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="wpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B38F24"/>
      <stop offset="100%" stop-color="#997300"/>
    </linearGradient>
  </defs>

  <!-- Outer crest ring -->
